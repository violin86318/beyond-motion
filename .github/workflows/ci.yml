# 只做构建和发布检查。
# 不部署、不读取密钥、不调用 wrangler 或 Cloudflare。
# 只在作者电脑上才能完成的步骤不在这里运行，例如
# .local-deploy/player-sources.json、MV 作品页部署、封面字体导出。

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 构建不需要向 Astro 上报使用数据。
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 完整历史用来判断 check:astro 是否曾经进入 package.json。
          # 浅克隆只看到「删掉脚本」的那一次提交时，删除记录会丢。
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # 仓库没有 .nvmrc，package.json 也没有 engines。
          # 锁文件里会实际安装的最严要求是 undici >=22.19.0；
          # Astro 5 为 18.20.8 || ^20.3.0 || >=22，顶层 sharp 0.35 为 >=20.9。
          # Node 22 同时满足这些范围。
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site and studio subsites
        run: npm run build:all

      # 直接跑脚本，不看 package.json 里有没有某个 npm script。
      # 把 check / verify 改成 true 也过不了：verify.mjs 会核对脚本内容。
      - name: Verify release checks
        run: node scripts/verify.mjs
